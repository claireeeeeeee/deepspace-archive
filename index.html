async function loadArchive() {
    const content = $('content');
    if (window.archiveCloudConfig) {
        $('archive-footer').textContent = '星轨档案 · 云端保存 · 可在数据管理导出备份';
        if (!window.supabase || typeof createCloudArchive !== 'function') {
            content.textContent = '登录组件加载失败，请刷新重试。';
            return;
        }
        cloud = createCloudArchive(window.archiveCloudConfig);
        try {
            if (await cloud.session()) await loadCloudArchive();
            else showSignIn();
        } catch (error) {
            showSignIn('无法读取云端档案：' + error.message);
        }
        return;
    }
    if (location.protocol === 'file:') {
        const link = el('a', '打开本机星轨档案');
        link.href = 'http://127.0.0.1:8765/';
        content.replaceChildren(link, el('p', '若无法打开，请双击同一文件夹里的「打开星轨档案.command」安装本机入口。'));
        return;
    }
    content.textContent = '正在读取档案.json…';
    try {
        const response = await fetch('/api/archive');
        if (!response.ok) throw Error('读取档案.json 失败');
        openArchive(await response.json(), response.headers.get('ETag'));
    } catch (error) {
        content.textContent = '读取档案失败。请确认本地服务已启动、档案.json 存在，然后刷新页面。';
    }
}

function openArchive(document, currentRevision) {
    db = document;
    revision = currentRevision;
    savedDb = structuredClone(db);
    active = db.accounts[0].id;
    render();
}

function showSignIn(message = '') {
    const auth = $('cloud-auth');
    $('content').replaceChildren();
    $('views').replaceChildren();
    $('accounts').hidden = true;
    auth.hidden = false;
    const form = el('form', undefined, 'line');
    const email = el('input');
    email.type = 'email';
    email.placeholder = '登录邮箱';
    email.setAttribute('aria-label', '登录邮箱');
    email.autocomplete = 'username';
    email.required = true;
    const password = el('input');
    password.type = 'password';
    password.placeholder = '登录密码';
    password.setAttribute('aria-label', '登录密码');
    password.autocomplete = 'current-password';
    password.required = true;
    const submit = el('button', '登录', 'primary');
    const mail = button('发送邮件登录链接', async () => {
        if (!email.reportValidity()) return;
        mail.disabled = true;
        feedback.textContent = '正在发送登录链接…';
        try {
            await cloud.sendSignInLink(email.value.trim(), new URL('./', location.href).href);
            feedback.textContent = '登录链接已发送。请从邮箱打开链接返回星轨档案。';
        } catch (error) {
            feedback.textContent = '邮件发送失败：' + error.message;
        } finally {
            mail.disabled = false;
        }
    });
    mail.type = 'button';
    const feedback = el('p', message);
    feedback.setAttribute('role', 'status');
    form.append(email, password, submit, mail);
    auth.replaceChildren(el('h2', '登录星轨档案'), form, feedback);
    form.onsubmit = async event => {
        event.preventDefault();
        submit.disabled = true;
        try {
            await cloud.signIn(email.value.trim(), password.value);
            password.value = '';
            await loadCloudArchive();
        } catch (error) {
            feedback.textContent = error.message === 'Invalid login credentials'
                ? '邮箱或密码不匹配。你也可以用邮件登录链接进入。'
                : '登录或读取失败：' + error.message;
        } finally {
            submit.disabled = false;
        }
    };
}

async function loadCloudArchive() {
    const row = await cloud.read();
    const auth = $('cloud-auth');
    auth.replaceChildren(button('退出登录', async () => {
        try {
            await cloud.signOut();
            location.reload();
        } catch (error) {
            alert('退出失败：' + error.message);
        }
    }));
    if (row) {
        openArchive(row.document, row.revision);
        return;
    }
    $('content').textContent = '这个登录账号没有可访问的星轨档案。';
}

async function save() {
    const main = document.querySelector('main');
    main.inert = true;
    try {
        if (cloud) {
            revision = await cloud.write(db, revision);
        } else {
            const response = await fetch('/api/archive', {
                method: 'PUT',
                headers: {'Content-Type': 'application/json', 'If-Match': revision},
                body: JSON.stringify(db, null, 2) + '\n',
            });
            if (!response.ok) {
                const problem = await response.json();
                throw Error(problem.error || '无法写入档案文件');
            }
            revision = response.headers.get('ETag');
        }
        savedDb = structuredClone(db);
        return true;
    } catch (error) {
        db = structuredClone(savedDb);
        active = acc().id;
        alert('保存失败：' + error.message);
        return false;
    } finally {
        main.inert = false;
    }
}

function overview(container) {
    const totals = panel();
    totals.append(el('h2', '档案汇总'));
    const grid = el('div', undefined, 'grid');
    const items = db.accounts.flatMap(account => account.items);
    const stats = [
        ['公共攻略', db.guide.length],
        ['账号记录', items.length],
        ['导入批次', db.history.length],
        ['待核实', db.review.length],
    ];
    for (const [label, total] of stats) {
        const metric = el('div', undefined, 'metric');
        metric.append(el('b', total), el('span', label));
        grid.append(metric);
    }
    totals.append(grid);
    container.append(totals);

    const accounts = panel();
    accounts.append(el('h2', '账号进度'));
    for (const account of db.accounts) {
        const row = el('div', undefined, 'item');
        const completed = account.items.filter(item => item.status === 'completed').length;
        const incomplete = account.items.filter(item => item.status === 'incomplete').length;
        const unknown = account.items.length - completed - incomplete;
        const info = el('div');
        info.append(el('strong', account.name),
            el('p', `共 ${account.items.length} 条 · 已完成 ${completed} · 未完成 ${incomplete} · 未知 ${unknown}`));
        row.append(info, button('查看账号', () => {
            active = account.id;
            view = 'account';
            render();
        }));
        accounts.append(row);
    }
    container.append(accounts);

    const guides = panel();
    guides.append(el('h2', '公共攻略'));
    for (const name of Object.keys(modules)) {
        const row = el('div', undefined, 'item');
        const count = db.guide.filter(item => item.module === name).length;
        row.append(el('span', `${name} · ${count} 条`), button('查看攻略', () => {
            mod = name;
            cat = '全部';
            view = 'guide';
            render();
        }));
        guides.append(row);
    }
    container.append(guides);
}

function encounterSummary(container, account) {
    const summary = account.summary;
    const detailed = new Map((summary.encounter_collection || []).map(row => [row.character, row]));
    const byCharacter = summary.encounter_collection_by_character || {};
    if (detailed.size || Object.keys(byCharacter).length) {
        const details = el('details');
        details.append(el('summary', '偶发遭遇收集进度'));
        for (const character of characters) {
            const row = detailed.get(character);
            const other = byCharacter[character];
            if (!row && !other) continue;
            const current = row?.collection_progress?.current ?? other?.collection_current;
            const target = row?.collection_progress?.target ?? other?.collection_target;
            const trigger = row?.trigger_milestone?.target ?? other?.encounter_trigger_target;
            details.append(el('p', character + ' · 收集度 ' + (current ?? '?') + ' / ' +
                (target ?? '?') + (trigger == null ? '' : ' · 下一个触发目标 ' + trigger)));
        }
        container.append(details);
    }
}

function appendSourceEvidence(container, accountItem) {
    const evidence = accountItem.source_evidence || [];
    if (!evidence.length) return;
    const section = el('details');
    section.append(el('summary', '截图来源与提取备注'));
    if (accountItem.notes) section.append(el('p', accountItem.notes));
    for (const {batch, images} of evidence) {
        if (!Array.isArray(images) || !images.length) continue;
        const labels = images.map(({number, filename}) =>
            filename ? `图 ${number}（${filename}）` : `图 ${number}`);
        section.append(el('p', batch + ' · ' + labels.join('、')));
    }
    container.append(section);
}

function importData(text, type) {
    const data = JSON.parse(text);
    if (data?.schema_version !== '1.0' || data.import_type !== type || !Array.isArray(data.items)) {
        throw Error('导入类型、版本或 items 格式不正确');
    }
    if (data.review_required != null && !Array.isArray(data.review_required)) {
        throw Error('review_required 必须是数组');
    }
    if (type === 'account') {
        const account = acc();
        const gameId = String(data.account_game_id ?? '').trim();
        const name = String(data.account_name ?? '').trim();
        if ((gameId && gameId !== String(account.gameId ?? '')) ||
            (!gameId && name && norm(name) !== norm(account.name))) {
            throw Error('JSON 标注的账号与当前账号不符，请切换到对应账号后再预览');
        }
        if (data.account_summary != null &&
            (typeof data.account_summary !== 'object' || Array.isArray(data.account_summary))) {
            throw Error('account_summary 必须是对象');
        }
    }
    return data;
}

function render(){let v=$('views');v.replaceChildren();for(let [k,l] of [['overview','汇总'],['account','我的账号'],['guide','攻略总库'],['ig','导入攻略'],['ia','导入账号'],['prompts','Prompt 中心'],['settings','数据管理']])v.append(button(l,()=>{view=k;pending=null;render()},view===k?'on':''));$('accounts').hidden=!['account','ia'].includes(view);$('account').replaceChildren(...db.accounts.map(a=>new Option(a.name+(a.gameId?' · '+a.gameId:''),a.id)));$('account').value=acc().id;let c=$('content');c.replaceChildren();if(view==='overview')return overview(c);if(view==='ig'||view==='ia')return importPage(c,view==='ig'?'guide':'account');if(view==='prompts')return prompts(c);if(view==='settings')return settings(c);let p=panel();tabs(p,Object.keys(modules).map(x=>[x,x]),mod,x=>{mod=x;cat='全部';render()});tabs(p,['全部',...modules[mod]].map(x=>[x,x]),cat,x=>{cat=x;render()});let rows=db.guide.filter(r=>r.module===mod&&(cat==='全部'||r.category===cat));let own=acc().items;let unmatched=own.filter(r=>!match(r,db.guide)&&r.module===mod&&(cat==='全部'||r.category===cat));let entries=rows.map(r=>({r,a:match(r,own)}));if(view==='account')entries.push(...unmatched.map(r=>({r,a:r,unmatched:true})));let g=el('div',undefined,'grid');for(let [l,n] of [['攻略收录',rows.length],...(view==='account'?[['已完成 / 收集',entries.filter(x=>x.a?.status==='completed').length],['未完成 / 收集',entries.filter(x=>x.a?.status==='incomplete').length],['未知',entries.filter(x=>!x.a?.status||x.a.status==='unknown').length],['待匹配',unmatched.length]]:[])]){let m=el('div',undefined,'metric');m.append(el('b',n),el('span',l));g.append(m)}p.append(g);if(view==='account'&&mod==='成就'&&acc().summary.achievement_points!=null)p.append(el('p','游戏成就点数：'+acc().summary.achievement_points+' / '+(acc().summary.achievement_stage_target??'未知')));if(view==='account'&&mod==='混沌深网')encounterSummary(p,acc());c.append(p);let list=panel(),bar=el('div',undefined,'line');bar.append(select(['全部',...characters].map(x=>[x,x]),char,x=>{char=x;render()}));if(view==='account')b function importPage(c,type){let p=panel();p.append(el('h2',type==='guide'?'导入公共攻略':'导入个人账号 · '+acc().name),el('p','粘贴 AI 提取的 JSON 或上传文件。先预览，再确认写入。'));let ta=el('textarea');ta.placeholder='{"schema_version":"1.0","import_type":"'+type+'","items":[]}';let file=el('input');file.type='file';file.accept='.json,application/json';file.onchange=async()=>{if(file.files[0])ta.value=await file.files[0].text();pending=null;preview.replaceChildren()};let preview=el('div');ta.oninput=()=>{pending=null;preview.replaceChildren()};p.append(ta,file,button('检查并预览',()=>{try{let data=importData(ta.value,type);let target=type==='guide'?db.guide:acc().items;let temp=clone(target);let out=data.items.map(r=>{if(!r||typeof r.name!=='string'||!r.name.trim()||!modules[r.module]||typeof r.category!=='string'||(type==='account'&&!['completed','incomplete','unknown'].includes(r.status)))return {r,kind:'无效',enabled:false};let m=match(r,temp),same=temp.filter(x=>key(x)===key(r));let changes=m?conflict(m,r):[];if(type==='account'&&m?.status==='completed'&&r.status!=='completed')changes.push('已完成状态保护');let kind=m?(changes.length?'冲突 / 更新':'重复 / 补全'):same.length?'身份冲突':'新增';if(!m&&!same.length)temp.push(r);return {r,kind,enabled:!changes.length&&kind!=='身份冲突',changes}});pending={data,out,type,account:active};drawPreview()}catch(e){preview.textContent=e.message;pending=null}},'primary'),preview);c.append(p);function drawPreview(){preview.replaceChildren();let {out}=pending;preview.append(el('h2','预览 · '+out.length+' 条'));let counts={};out.forEach(x=>counts[x.kind]=(counts[x.kind]||0)+1);preview.append(el('p',Object.entries(counts).map(([k,v])=>k+' '+v).join(' · ')));for(let x of out){let d=el('div',undefined,'item'),t=el('div');t.append(el('strong',x.r?.name||'无效条目'),el('p',x.kind+' '+(x.changes||[]).join('、')));let dt=el('details');dt.append(el('summary','查看 / 编辑 JSON'));let edit=el('textarea');edit.value=JSON.stringify(x.r,null,2);edit.onchange=()=>{try{x.r=JSON.parse(edit.value);x.enabled=false;cb.c const schemaGuide={schema_version:'1.0',import_type:'guide',items:[{module:'成就',category:'家园纪事',subcategory:null,name:'示例（不要导入）',character:null,description:null,condition:null,guide:null,prerequisites:null,target:{value:null,unit:null},rewards:[],achievement_points:null,is_hidden:null,details:{},source_images:[],needs_review:false,notes:null}],review_required:[]};const schemaAccount={schema_version:'1.0',import_type:'account',account_name:null,account_game_id:null,account_summary:{achievement_points:null,achievement_stage_target:null},items:[{module:'成就',category:'家园纪事',subcategory:null,name:'示例（不要导入）',character:null,description:null,status:'unknown',progress:{current:null,target:null,unit:null},completed_at:null,reward_claimed:null,observed_rewards:[],observed_achievement_points:null,details:{},source_images:[],needs_review:false,notes:null}],review_required:[]};function promptText(type){return `你是《恋与深空》${type==='guide'?'公共攻略':'个人账号'}数据提取助手。${type==='account'?'开始任何提取前，必须先询问用户：这批截图属于哪个账号？请选择：'+db.accounts.map(a=>a.name+(a.gameId?'（'+a.gameId+'）':'')).join('、')+'。即使已上传截图，也必须等待用户明确确认后才开始提取；不得默认或猜测账号。若更换账号或新批次归属不明确，重新询问。输出 JSON 根对象额外包含 account_name 和 account_game_id，并在报告中注明确认的账号；不同账号的数据不得混合。':''}逐张按上传顺序编号，完整读取原图所有列、边缘、底部、注释、图例和流程箭头；保留原文、角色、条件、奖励、分支、阶段和数值。相邻截图重叠时补全并去重，同名不同角色、条件、路径或阶段必须独立记录。只依据图片，不猜测；不可辨认用 null 并放入 review_required，附图片编号及疑问。奖励图标无法确定名称时记录 icon_description 和 quantity。模块必须使用：混沌深网（事件、道具、通用代码、代码套组）、灵空行动（事件、道具）、成就（成长轨迹、猎人行动、喵星派对、娃娃乐园、假日心情、家园纪事）、家园互动（朋友圈、短信）；括号内为 category，细分类放 subcategory，地图、路线、节点、选项及分支放 details。角色不明确用 null。${type==='account'?'仅记录账号截图证据；状态 completed/incomplete/unknown，未出现不等于未完成；日期转 YYYY-MM-DD；未显示当前值不要用目标值代替；总成就点数不累加；奖励领取与完成分开；冲突保留待核实。':'攻略作者说明与游戏原文分开，不推断个人完成情况。'}\n完成首次提取后重新逐图核查名称、角色、数字、日期、奖励、截断、重复与遗漏。先报告图片数、独立条目数、重复数、待核实数，再输出完整有效 JSON（可分批，每批独立有效，不含注释或省略号）。下面仅是结构示例，不能将示例当作实际数据：\n${JSON.stringify(type==='guide'?schemaGuide:schemaAccount,null,2)}`}
function prompts(c){for(let [type,title] of [['guide','公共攻略图片提取'],['account','个人账号截图提取']]){let p=panel();p.append(el('h2',title),el('p','把 Prompt 和截图一起发给 AI。将输出的 JSON 对象粘贴到对应的导入页，或保存为 .json 后上传。账号数据请先选中对应账号。'));let ta=el('textarea');ta.value=promptText(type);ta.readOnly=true;p.append(button('一键复制 Prompt',async()=>{try{await navigator.clipboard.writeText(ta.value);notify('已复制')}catch{ta.select();if(document.execCommand('copy'))notify('已复制');else notify('请手动复制选中的文字')}},'primary'),ta,button('下载 JSON 格式示例',()=>download(type+'-schema.json',type==='guide'?schemaGuide:schemaAccount)));c.append(p)}}
function settings(c){let p=panel();p.append(el('h2','备份与恢复'),button('导出整体档案 JSON',()=>download('deepspace-archive.json',db),'primary'),button('导出公共攻略',()=>download('guide.json',{schema_version:'1.0',import_type:'guide',items:db.guide,review_required:[]})),button('导出当前账号',()=>download('account.json',{schema_version:'1.0',import_type:'account',account_name:acc().name,account_game_id:acc().gameId,items:acc().items,account_summary:acc().summary,review_required:[]})));let f=el('input');f.type='file';f.accept='.json';f.onchange=async()=>{try{let v=JSON.parse(await f.files[0].text());if(!Array.isArray(v.guide)||!Array.isArray(v.accounts)||!v.accounts.length||!v.accounts.every(a=>a.id&&a.name&&Array.isArray(a.items)))throw Error();if(confirm('恢复备份会替换当前档案，继续？')){db={...v,accounts:v.accounts.map(a=>({summary:{},...a})),history:v.history||[],review:v.review||[]};active=db.accounts[0].id;if(await save())render()}}catch{alert('备份无效')}};p.append(el('p','恢复完整备份（会替换当前数据）'),f);c.append(p);let h=panel();h.append(el('h2','导入历史'));for(let x of [...db.history].reverse()){let d=el('div',undefined,'item');d.append(el('div',x.label+' · '+new Date(x.time).toLocaleString()),button('撤销至此批前',async()=>{if(confirm('这会撤销本批及之后所有更改，继续？')){Object.assign(db,clone(x.before));db.history=db.history.slice(0,db.history.findIndex(y=>y.id===x.id));active=db.accounts[0].id;await save();render()}}));h.append(d)}if(!db.history.length)h.append(el('p','暂无导入历史'));c.append(h);let r=panel();r.append(el('h2','导入待核实 · '+db.review.length));for(let x of db.review){let dt=el('details');dt.append(el('summary',x.item?.name||'待核实记录'),el('pre',JSON.stringify(x,null,2)));r.append(dt)}c.append(r);let d=panel();d.append(el('h2','清空收集资料'),el('p','保留账号名称与游戏 ID；请先导出备份。'),button('清空攻略及全部账号进度',async()=>{if(prompt('输入 清空 确认')==='清空'){snapshot('清空资料');db.guide=[];db.review=[];db.accounts.forEach(a=>{a.items=[];a.summary={}});await save();render()}},'danger'));c.append(d)}
